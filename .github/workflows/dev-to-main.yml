name: CI and Auto-Merge to Main

on:
  push:
    branches: [ "dev" ]

concurrency:
  group: ci-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  test-and-clippy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain with Clippy
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy

      - name: Install Linux Dependencies
        env:
          DEBIAN_FRONTEND:  noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libwayland-dev libxkbcommon-dev libasound2-dev libudev-dev

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check disk space (before build)
        run: |
          echo "=== Disk usage ==="
          df -h
          echo "=== Largest dirs on root ==="
          sudo du -sh /usr/* /opt/* /home/* 2>/dev/null | sort -rh | head -20

      - name: Run Clippy
        run: cargo clippy -- -D warnings

      - name: Check disk space (after clippy, before tests)
        run: |
          df -h
          echo "=== target dir size ==="
          du -sh target 2>/dev/null || echo "no target dir yet"

      - name: Run Tests
        run: cargo test

      - name: Run Tests
        run: |
          free -h
          cargo test
          CARGO_PID=$!
          while kill -0 $CARGO_PID 2>/dev/null; do
            free -h
            sleep 25
          done
          wait $CARGO_PID

      - name: Check disk space (after tests)
        if: always()
        run: |
          df -h
          du -sh target 2>/dev/null || echo "no target dir"

  create-and-merge-pr:
    needs: test-and-clippy
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create PR and Enable Auto-Merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
            gh pr create \
            --base main \
            --head dev \
            --title "ci: merge dev into main" \
            --body "Automated PR created by GitHub Actions after passing checks." || true

            gh pr merge dev --auto --merge
