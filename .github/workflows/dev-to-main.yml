name: CI and Auto-Merge to Main

on:
  push:
    branches: [ "dev" ]

concurrency:
  group: ci-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  test-and-clippy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain with Clippy
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy

      - name: Install Linux Dependencies
        env:
          DEBIAN_FRONTEND:  noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libwayland-dev libxkbcommon-dev libasound2-dev libudev-dev

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run Clippy
        run: cargo clippy -- -D warnings

      - name: Install mold linker
        run: sudo apt-get install -y mold

      - name: Run Tests
        env:
          CARGO_BUILD_JOBS: "2"
          RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
        run: |
          cargo test

  create-and-merge-pr:
    needs: test-and-clippy
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create PR and Enable Auto-Merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
            gh pr create \
            --base main \
            --head dev \
            --title "ci: merge dev into main" \
            --body "Automated PR created by GitHub Actions after passing checks." || true

            gh pr merge dev --auto --merge
